name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: API check
        run: npm run api:check

  smoke:
    name: Smoke-test packaged artifact
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pack the real tarball, install it in an isolated app, and require both
      # entry points — fails the build if the exports map, dist files, or worker
      # paths are broken in a way `npm pack --dry-run` wouldn't catch.
      - name: Smoke-test packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(pwd)"
          pack_json="$(npm pack --json)"
          tarball_name="$(node -e "process.stdout.write(JSON.parse(process.argv[1])[0].filename)" "$pack_json")"
          tarball="$repo_root/$tarball_name"
          test -f "$tarball" || { echo "tarball not found: $tarball"; exit 1; }
          smoke="$(mktemp -d)"
          cd "$smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tarball" three react react-dom
          node -e "const m = require('@vitekk02/cadjs'); if (!m || typeof m !== 'object') throw new Error('require returned non-object'); console.log('core exports:', Object.keys(m).slice(0, 5).join(','), '...');"
          node -e "const m = require('@vitekk02/cadjs/react'); if (!m || typeof m !== 'object') throw new Error('require returned non-object'); console.log('react exports:', Object.keys(m).slice(0, 5).join(','), '...');"
